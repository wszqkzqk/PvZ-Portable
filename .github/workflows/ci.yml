name: CI build

on:
  push:
    branches: [ "32-bit-test" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-switch:
    name: Build for Switch
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compile libopenmpt for Switch
        shell: bash
        run: |
          source $DEVKITPRO/switchvars.sh
          OPENMPT_TAG=$(git ls-remote --tags https://github.com/OpenMPT/openmpt.git 'refs/tags/libopenmpt-*' \
            | sed 's|.*refs/tags/libopenmpt-||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$OPENMPT_TAG" ]; then
            OPENMPT_TAG="0.8.4" # Fallback to a known stable version if tag retrieval fails
          fi
          git clone --depth=1 --branch "libopenmpt-${OPENMPT_TAG}" https://github.com/OpenMPT/openmpt.git openmpt
          cd openmpt
          make CONFIG=gcc SHARED_LIB=0 DYNLINK=0 EXAMPLES=0 OPENMPT123=0 TEST=0 -j$(nproc)
          make CONFIG=gcc SHARED_LIB=0 DYNLINK=0 EXAMPLES=0 OPENMPT123=0 TEST=0 PREFIX=$PORTLIBS_PREFIX install

      - name: Compile PvZ-Portable for Switch
        shell: bash
        run: |
          source $DEVKITPRO/switchvars.sh
          mkdir build
          cd build
          aarch64-none-elf-cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE=-O2
          make -j$(nproc)
          aarch64-none-elf-strip pvz-portable.elf

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pvz-portable-switch
          path: |
            ./build/pvz-portable.nro
            ./build/pvz-portable.elf
